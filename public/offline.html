<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnora — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070C18;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 20px;
      padding: 28px 24px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #CBD5E1;
      margin: 0 0 20px;
    }
    button {
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background: #1E6FD9;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are currently offline</h1>
    <p>Please check your mobile data or Wi-Fi connection and try again. Your Earnora balance and rewards are safely stored on our servers.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
